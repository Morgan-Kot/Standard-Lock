[workspace]
resolver = "2"
members = [
    "core",
    "lock-app",
    "home-app",
]

[profile.release]
opt-level = "z" 
lto = true 
codegen-units = 1  
panic = "abort" 
strip = true        

[dependencies]
standard-lock-core = { path = "../core" }
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }
rfd = "0.14"
