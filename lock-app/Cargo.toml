[package]
name = "standard-lock"
version = "0.1.0"
edition = "2021"
description = "Standard Lock - background file interceptor. Nothing opens without permission."

[[bin]]
name = "standard-lock"
path = "src/main.rs"

[dependencies]
standard_lock_core = { path = "../core" }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]

# No console window when double-clicked / launched by the shell.
[target.'cfg(windows)'.dependencies]

[package.metadata.winres]
# icon = "../assets/lock.ico"   # add an .ico here if you want a custom tray icon
